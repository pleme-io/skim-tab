[package]
name = "skim-tab"
version = "0.1.13"
edition = "2024"
rust-version = "1.89.0"
description = "Rust-native fuzzy completion bridge for zsh — drop-in fzf replacement for fzf-tab using skim"
license = "MIT"
authors = ["Pleme Team <team@pleme.io>"]
repository = "https://github.com/pleme-io/skim-tab"
homepage = "https://github.com/pleme-io/skim-tab"
keywords = ["zsh", "completion", "fuzzy-finder", "skim", "fzf-tab"]
categories = ["command-line-utilities"]
exclude = ["module/", "target/", "result-*", "Cargo.nix", "flake.nix", "flake.lock"]

[lib]
name = "skim_tab"
path = "src/lib.rs"

[[bin]]
name = "skim-tab"
path = "src/main.rs"

[[bin]]
name = "skim-history"
path = "src/history.rs"

[[bin]]
name = "skim-files"
path = "src/files.rs"

[[bin]]
name = "skim-content"
path = "src/content.rs"

[[bin]]
name = "skim-cd"
path = "src/cd.rs"

[[bin]]
name = "skim-fvim"
path = "src/fvim.rs"

[[bin]]
name = "skim-fco"
path = "src/fco.rs"

[[bin]]
name = "skim-fkill"
path = "src/fkill.rs"

[[bin]]
name = "skim-kpod"
path = "src/kpod.rs"


[dependencies]
skim = "3.7"
regex = "1"
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lscolors = "0.20"
serde_yaml = "0.9"
shikumi = { git = "https://github.com/pleme-io/shikumi" }
# wadachi-spec — the fleet's one frecency-ranking formula. skim-tab's
# command-history frecency_score delegates here so it can never drift from
# wadachi's directory frecency (the extraction the design calls for). Git source
# (same workspace as pleme-io-wadachi below) so there is one wadachi-spec.
wadachi-spec = "0.1.4"
# pleme-io-wadachi (lib imported as `wadachi`) — skim-cd is a READER: it ranks
# the directory picker by frecency via wadachi::top_n. It never records (the
# shell already did at cd time — single-recorder rule). Git source for the
# in-process facade (top_n landed post-0.1.2).
pleme-io-wadachi = "0.1.4"
rusqlite = { version = "0.32", features = ["bundled"] }
crossterm = "0.29"
thiserror = "2.0.18"
# nix — fd plumbing for TtyStdoutGuard (stdout→tty swap around every skim
# run; see lib.rs). Same version skim itself pulls, so nothing new enters
# the tree. "term"/"process" feed the pty regression test in
# tests/picker_stdout_purity.rs. "user" — getuid() for the
# `launchctl kickstart -k gui/<uid>/...` lazy daemon spawn (daemon.rs
# ensure_socket).
nix = { version = "0.29", features = ["fs", "term", "process", "signal", "user"] }

[dev-dependencies]
tempfile = "3"
# libc — async-signal-safe _exit in the pty regression test's fork child
# (tests/picker_stdout_purity.rs), mirroring frost's L0 harness.
libc = "0.2"
# proptest — Pillar-10 property testing for the frecency-parity invariant
# (tests/frecency_parity.rs): skim-tab's frecency_score path must equal the
# wadachi-spec interpreter for arbitrary visit histories, forever.
proptest = "1"
# chrono — only to construct the NaiveDateTime visit timestamps wadachi-spec's
# typed border (DirEntry) speaks. Same major as wadachi-spec's own dep.
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
